[project]
name = "astrolabe"
version = "0.1.0"
description = "Read-only prediction-market intelligence over public Polymarket data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "websockets>=12.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    # Accounts / authentication (native, not from scratch): fastapi-users handles registration,
    # email verification, password reset and secure sessions; argon2 hashing via pwdlib.
    "fastapi-users[sqlalchemy]>=15.0",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
    "anyio>=4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astrolabe*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:astrolabe.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # (str, Enum) is intentional for stable .value JSON serialization
]
