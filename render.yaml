# Render blueprint for the Arepo FastAPI backend + scheduled jobs (spec §16, §19, §20).
#
# This provisions the backend web service and the UTC cron jobs. It does NOT contain any secrets:
# AUTH_SECRET, DATABASE_URL and RESEND_API_KEY are marked sync:false and must be set by the user
# in the Render dashboard (or linked from a Supabase/Resend integration). Deploying this file
# still requires the user to create the Render account and connect the repository.
#
# Frontend is deployed separately on Vercel (see vercel.json).

services:
  - type: web
    name: arepo-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt && pip install -e .
    # Release phase: apply the additive schema migration BEFORE the new version serves traffic and
    # before any collector job runs. Idempotent; halts the deploy on failure (final pre-deployment
    # §3). Does not depend on the web server being awake.
    preDeployCommand: python -m astrolabe.storage.migrate_cli upgrade
    startCommand: uvicorn astrolabe.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: DEFAULT_MODE
        value: live
      # Belt-and-suspenders: collector jobs also self-migrate on start. Set to "false" to rely only
      # on the release command (jobs then fail-fast with an actionable message if the schema is old).
      - key: AUTO_MIGRATE
        value: "true"
      # Secrets and per-environment values: set in the Render dashboard, never committed.
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL          # Supabase Postgres: use the transaction pooler URL (see docs)
        sync: false
      - key: APP_BASE_URL          # e.g. https://arepo.vercel.app
        sync: false
      - key: CORS_ORIGINS          # e.g. https://arepo.vercel.app,https://arepo-*.vercel.app
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: ALERT_EMAIL_ENABLED
        sync: false
      - key: ALERT_PROVIDER
        value: resend
      - key: ALERT_SENDER          # a verified Resend sender, e.g. alerts@yourdomain
        sync: false
      - key: RESEND_API_KEY
        sync: false

# Scheduled jobs (all idempotent, all UTC). Each runs the existing CLI entry points. They share
# the same DATABASE_URL and secrets as the web service via an env group in the dashboard.
crons:
  - name: arepo-microstructure
    runtime: python
    rootDir: backend
    schedule: "*/5 * * * *"       # every 5 minutes: spread/depth/volume snapshots (spec §7, §19)
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.ingest.microstructure_cli collect --mode live
  - name: arepo-opportunity-snapshot
    runtime: python
    rootDir: backend
    schedule: "10 0 * * *"        # daily 00:10 UTC: freeze the immutable Opportunity snapshot
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.opportunity.cli snapshot --mode live
  - name: arepo-cohort-rank
    runtime: python
    rootDir: backend
    schedule: "0 * * * *"         # hourly: update this week's provisional cohort ranking
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.evaluation.cli rank --mode live
  - name: arepo-cohort-freeze
    runtime: python
    rootDir: backend
    schedule: "59 23 * * 0"       # Sunday 23:59 UTC: freeze the weekly cohort
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.evaluation.cli freeze
  - name: arepo-forward-prices
    runtime: python
    rootDir: backend
    schedule: "30 * * * *"        # hourly: collect due forward prices (1h/24h/7d)
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.evaluation.cli forward
  - name: arepo-resolve
    runtime: python
    rootDir: backend
    schedule: "15 */6 * * *"      # every 6h: record newly-available resolutions
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.evaluation.cli resolve
  - name: arepo-alerts
    runtime: python
    rootDir: backend
    schedule: "20 * * * *"        # hourly: evaluate per-user alerts (no-op unless enabled)
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.alerts.cli user-dry-run --mode live

  # --- Edge-research infrastructure jobs (edge-research prompt §3, §5, §17C) ------------------
  # The freeze jobs fire a few minutes AFTER each cadence boundary, so the cohort's cut-off (snapped
  # to the boundary) is ~equal to when the prices were captured, and every 1h/6h/24h/7d horizon is
  # genuinely in the future (the collector rejects any horizon that predates the freeze). Each
  # freeze is idempotent on (cadence, cut-off): a re-run in the same period is a no-op.
  - name: arepo-research-freeze-6h
    runtime: python
    rootDir: backend
    schedule: "5 0,6,12,18 * * *"  # 00:05/06:05/12:05/18:05 UTC: freeze the 6-hour research cohort
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.evaluation.research_cli research-freeze --cadence 6h
  - name: arepo-research-freeze-daily
    runtime: python
    rootDir: backend
    schedule: "10 0 * * *"         # daily 00:10 UTC: freeze the daily research cohort
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.evaluation.research_cli research-freeze --cadence daily
  - name: arepo-research-freeze-weekly
    runtime: python
    rootDir: backend
    schedule: "15 0 * * 1"         # Monday 00:15 UTC: freeze the weekly research cohort
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.evaluation.research_cli research-freeze --cadence weekly
  - name: arepo-research-forward
    runtime: python
    rootDir: backend
    schedule: "*/20 * * * *"       # every 20 min: record any due 1h/6h/24h/7d forward observation
    buildCommand: pip install -r requirements.txt && pip install -e .
    command: python -m astrolabe.evaluation.research_cli research-forward
  # Final resolutions are shared: the existing arepo-resolve cron populates market_resolutions,
  # which the research layer reads for its resolution view (no separate research-resolve cron).
