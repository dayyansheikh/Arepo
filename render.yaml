# Render blueprint for the Arepo FastAPI backend (free-production deployment pass).
#
# SCHEDULING NOTE (master prompt §21): Render cron jobs are a PAID feature and are intentionally NOT
# used in the £0 path. All scheduled computation (complete scans, cohort freezes, forward/preclose/
# resolve collection, retention, backups) runs on GitHub Actions via a single idempotent tick — see
# .github/workflows/scheduler.yml and .github/workflows/backup.yml. Render hosts ONLY the API web
# service, which serves persisted complete results and user requests; a normal request never triggers
# a universe rebuild (docs/PRODUCTION_CAPACITY_AUDIT.md §4 shows a complete scan's peak memory/runtime
# does not fit comfortably inside Render Free, which is the evidence for this split).
#
# This file contains NO secrets: AUTH_SECRET, DATABASE_URL, ADMIN_TOKEN and RESEND_API_KEY are marked
# sync:false and are set in the Render dashboard. Frontend is deployed separately on Vercel.
#
# ``plan: free`` keeps the API on the genuinely-free tier. Render Free web services cold-start after
# idle; the frontend shows a restrained "Connecting to Arepo data…" state (master prompt §13).

services:
  - type: web
    name: arepo-api
    runtime: python
    rootDir: backend
    plan: free
    # Apply the additive schema migration as the LAST build step, so it runs BEFORE the new version
    # serves traffic and HALTS THE DEPLOY on failure (fail-fast, idempotent). Render Free does NOT
    # support `preDeployCommand` (that is a paid release phase), so the migration lives in the build
    # instead — the build container has the service env vars (incl. DATABASE_URL) and outbound network
    # to Postgres. The app ALSO self-migrates on startup (AUTO_MIGRATE below) as belt-and-suspenders.
    # If a build ever cannot reach the DB, remove the `&& migrate_cli upgrade` and run it once from
    # your Mac instead (see docs/FREE_PRODUCTION_DEPLOYMENT.md Step 2 fallback) — startup still migrates.
    buildCommand: pip install -r requirements.txt && pip install -e . && python -m astrolabe.storage.migrate_cli upgrade
    startCommand: uvicorn astrolabe.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_JSON
        value: "true"
      - key: DEFAULT_MODE
        value: live
      # Belt-and-suspenders: the API and every collector self-migrate on start. With the build-step
      # migration above this is redundant on a healthy deploy, but it guarantees additive column adds
      # are applied even if a future deploy skips the build migration.
      - key: AUTO_MIGRATE
        value: "true"
      # Secrets and per-environment values: set in the Render dashboard, never committed.
      - key: AUTH_SECRET
        sync: false
      - key: ADMIN_TOKEN           # guards /admin/health; unset => admin route disabled (404)
        sync: false
      - key: DATABASE_URL          # Supabase: SESSION pooler URL (…pooler.supabase.com:5432), postgresql+asyncpg (see docs)
        sync: false
      - key: APP_BASE_URL          # e.g. https://arepo.vercel.app
        sync: false
      - key: CORS_ORIGINS          # e.g. https://arepo.vercel.app,https://arepo-*.vercel.app
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: ALERT_EMAIL_ENABLED
        sync: false
      - key: ALERT_PROVIDER
        value: resend
      - key: ALERT_SENDER          # a verified Resend sender, e.g. alerts@yourdomain
        sync: false
      - key: RESEND_API_KEY
        sync: false

# NOTE: There is intentionally NO `crons:` section. Render cron jobs are PAID; the genuinely-free
# scheduled-compute path is GitHub Actions (.github/workflows/scheduler.yml), where a single
# idempotent tick decides what work is due. The previous per-job Render cron schedule is preserved
# for reference in docs/FREE_PRODUCTION_DEPLOYMENT.md and mapped onto the tick's due-logic there.
