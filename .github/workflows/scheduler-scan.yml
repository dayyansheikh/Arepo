# Arepo SCAN job — the heavy half of the split scheduler (complete universe scan + causally-due
# cohort freeze). Separated from the light collect job so a 20–30 min complete scan never starves
# observation collection. No research logic lives in YAML; it only invokes the tick CLI (--group scan).
#
# Free & unlimited for PUBLIC repos. Cron drifts 5–30 min; the job is idempotent, lease-protected and
# self-terminating, so drift only changes WHEN it runs.

name: arepo-scan

on:
  # AUTOMATIC DEEP SCANS PAUSED (2026-08-22) during the lean-architecture development period. The
  # database reached 935 MB / 500 MB (Supabase Free) and continuous availability is not currently
  # required, so the heavy scan (complete universe + cohort freeze) — the dominant source of storage,
  # egress and compute — is paused to stop growth while the two-deep-scans/day + retention/compaction
  # architecture is built and validated on the feature branch. Manual runs remain available via
  # workflow_dispatch. Re-enable the schedule (originally: cron "5,35 * * * *") when the new
  # architecture is deployed with its intended cadence. Collect stays scheduled so already-frozen
  # cohorts still complete their forward horizons; no prospective cohort is reconstructed.
  # schedule:
  #   - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the refresh due-gate (true/false)"
        required: false
        default: "false"

concurrency:
  group: arepo-scan
  cancel-in-progress: false   # never cancel an in-progress scan; the next schedule catches up

jobs:
  scan:
    runs-on: ubuntu-latest
    # > TICK_HARD_DEADLINE_SECONDS (2100/35min) + build, so the app aborts cleanly before the runner.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: production
      LOG_JSON: "true"
      DEFAULT_MODE: live
      AUTO_MIGRATE: "true"
      PYTHONUNBUFFERED: "1"
      SCAN_TIMEOUT_SECONDS: "1800"          # 30-min hard cap on the complete scan
      TICK_HARD_DEADLINE_SECONDS: "2100"    # 35-min outer deadline (< 40-min workflow timeout)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      ALERT_EMAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run scan tick (refresh + freeze)
        run: |
          EXTRA=""
          [ "${{ github.event.inputs.force }}" = "true" ] && EXTRA="--force"
          python -m astrolabe.scheduler.tick run --group scan $EXTRA
      - name: Health snapshot (always)
        if: always()
        run: python -m astrolabe.scheduler.tick status || true
