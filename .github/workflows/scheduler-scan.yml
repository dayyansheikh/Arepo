# Arepo SCAN job — the heavy half of the split scheduler (complete universe scan + causally-due
# cohort freeze). Separated from the light collect job so a 20–30 min complete scan never starves
# observation collection. No research logic lives in YAML; it only invokes the tick CLI (--group scan).
#
# Free & unlimited for PUBLIC repos. Cron drifts 5–30 min; the job is idempotent, lease-protected and
# self-terminating, so drift only changes WHEN it runs.

name: arepo-scan

on:
  schedule:
    - cron: "5,35 * * * *"   # every 30 min at :05/:35 UTC (offset off the top of the hour). The
                             # 6-hour cohort freeze rides on this: the first scan after each 00/06/
                             # 12/18 boundary freezes that boundary's cohort. Measured ~9-10 min.
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the refresh due-gate (true/false)"
        required: false
        default: "false"

concurrency:
  group: arepo-scan
  cancel-in-progress: false   # never cancel an in-progress scan; the next schedule catches up

jobs:
  scan:
    runs-on: ubuntu-latest
    # > TICK_HARD_DEADLINE_SECONDS (2100/35min) + build, so the app aborts cleanly before the runner.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: production
      LOG_JSON: "true"
      DEFAULT_MODE: live
      AUTO_MIGRATE: "true"
      PYTHONUNBUFFERED: "1"
      SCAN_TIMEOUT_SECONDS: "1800"          # 30-min hard cap on the complete scan
      TICK_HARD_DEADLINE_SECONDS: "2100"    # 35-min outer deadline (< 40-min workflow timeout)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      ALERT_EMAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run scan tick (refresh + freeze)
        run: |
          EXTRA=""
          [ "${{ github.event.inputs.force }}" = "true" ] && EXTRA="--force"
          python -m astrolabe.scheduler.tick run --group scan $EXTRA
      - name: Health snapshot (always)
        if: always()
        run: python -m astrolabe.scheduler.tick status || true
