# Daily Postgres backup (AREPO_FREE_PRODUCTION_DEPLOYMENT_MASTER_PROMPT §14).
#
# Runs pg_dump against the production database and uploads a compressed, timestamped artifact.
# GitHub artifacts are free (retention configurable, default 90 days here). This is a genuinely-free
# backup path independent of the application: a code rollback never touches it, and it is the source
# for a data restore (see docs/PRODUCTION_ROLLBACK.md). Optionally also pushed to an object store
# (Cloudflare R2) when those secrets are configured — otherwise the artifact alone is the backup.

name: arepo-db-backup

on:
  schedule:
    - cron: "40 3 * * *"   # 03:40 UTC daily, away from congested top-of-hour boundaries
  workflow_dispatch: {}

concurrency:
  group: arepo-db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          source /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            "Architectures: $(dpkg --print-architecture)" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Dump and compress
        env:
          # Supabase SESSION pooler URL (…pooler.supabase.com:5432), plain postgresql:// (no +asyncpg).
          # The direct connection is IPv6-only on the free plan and unreachable from IPv4 Actions runners;
          # the transaction pooler (6543) is not suitable for pg_dump. Session pooler works for both.
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -o pipefail
          test -n "$BACKUP_DATABASE_URL" || { echo "BACKUP_DATABASE_URL secret is not set"; exit 1; }
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="arepo-backup-${STAMP}.sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges \
            "$BACKUP_DATABASE_URL" | gzip -9 > "$OUT"
          ls -lh "$OUT"
          # Integrity check: the gzip must decompress and be non-trivial.
          gzip -t "$OUT"
          SIZE=$(stat -c%s "$OUT")
          test "$SIZE" -gt 1000 || { echo "backup suspiciously small ($SIZE bytes)"; exit 1; }
          echo "OUT=$OUT" >> "$GITHUB_ENV"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: arepo-db-backup
          path: ${{ env.OUT }}
          retention-days: 90
          if-no-files-found: error
