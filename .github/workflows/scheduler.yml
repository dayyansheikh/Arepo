# Arepo production scheduler — the genuinely-free replacement for paid Render cron jobs
# (AREPO_FREE_PRODUCTION_DEPLOYMENT_MASTER_PROMPT §11, §17, §21).
#
# A single idempotent TICK runs on a schedule; the APPLICATION decides what work is due and runs only
# that (complete scan if stale, causally-due cohort freezes, forward/preclose/resolve, retention).
# No Arepo research logic lives in this YAML — it only invokes the existing tick CLI.
#
# Cost: GitHub-hosted runners are FREE and unlimited for PUBLIC repositories. On a private repo the
# Free plan allows only 2,000 minutes/month, which a frequent complete scan exceeds — so the £0 path
# requires this repository to be public (see docs/FREE_PRODUCTION_DEPLOYMENT.md). Scheduled runs are
# delay-tolerant by design (GitHub cron drifts 5–30 min); the tick never assumes exact-second timing.

name: arepo-scheduler-tick

on:
  schedule:
    # Every 5 minutes. GitHub enforces a 5-minute minimum and may delay/skip under load; the tick is
    # idempotent and decides due work, so drift only changes WHEN work runs, never WHETHER it double-runs.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only one job (refresh|freeze|forward|preclose|resolve|retention); blank = full tick"
        required: false
        default: ""
      force:
        description: "Ignore due-gates for the selected job (true/false)"
        required: false
        default: "false"

# One tick at a time at the GitHub level (belt-and-suspenders alongside the DB lease). Do NOT cancel
# an in-progress heavy scan — let it finish; the next schedule catches up.
concurrency:
  group: arepo-scheduler-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # Must exceed the app-level SCAN_TIMEOUT_SECONDS (default 1800s/30min) + build time, so the app
    # aborts a slow scan CLEANLY (releasing its lease) before the runner SIGKILLs the job. A hosted
    # runner is much slower than the ~5-min local benchmark (latency + shared-IP rate limiting).
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: production
      LOG_JSON: "true"
      DEFAULT_MODE: live
      AUTO_MIGRATE: "true"
      PYTHONUNBUFFERED: "1"   # stream progress logs live instead of buffering until exit
      # Secrets configured in the repository's Settings → Secrets and variables → Actions.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
      ALERT_PROVIDER: resend
      ALERT_SENDER: ${{ secrets.ALERT_SENDER }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run scheduler tick
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            EXTRA="--only ${{ github.event.inputs.only }}"
            [ "${{ github.event.inputs.force }}" = "true" ] && EXTRA="$EXTRA --force"
            python -m astrolabe.scheduler.tick run $EXTRA
          else
            python -m astrolabe.scheduler.tick run
          fi
      - name: Health snapshot (always, for the run log)
        if: always()
        run: python -m astrolabe.scheduler.tick status || true
